<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">TubePlanner CLI ranking preview</title>
  <desc id="desc">A visual summary of public transport proposal ranking with graph scoring and terminal output.</desc>
  <rect width="1000" height="560" fill="#f6f7f9"/>
  <rect x="44" y="42" width="912" height="476" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="82" y="92" fill="#1b2430" font-family="Arial, sans-serif" font-size="34" font-weight="700">TubePlanner</text>
  <text x="82" y="124" fill="#647184" font-family="Arial, sans-serif" font-size="17">Network extension ranking with cost and max-flow criteria</text>

  <g transform="translate(82 170)">
    <rect width="390" height="278" rx="12" fill="#101820"/>
    <circle cx="22" cy="24" r="6" fill="#f25f5c"/>
    <circle cx="43" cy="24" r="6" fill="#ffe066"/>
    <circle cx="64" cy="24" r="6" fill="#70c1b3"/>
    <text x="24" y="68" fill="#dbe7f3" font-family="Menlo, Consolas, monospace" font-size="15">Tube Planning Showcase</text>
    <text x="24" y="101" fill="#8ee4af" font-family="Menlo, Consolas, monospace" font-size="14">Baseline: 6 stations, 6 links</text>
    <text x="24" y="135" fill="#f4d35e" font-family="Menlo, Consolas, monospace" font-size="14">Rank  Proposal             Score</text>
    <text x="24" y="168" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="14">1     central_connector   149.40</text>
    <text x="24" y="201" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="14">2     crosslink            97.40</text>
    <text x="24" y="244" fill="#7dd3fc" font-family="Menlo, Consolas, monospace" font-size="14">essential constraints: pass</text>
  </g>

  <g transform="translate(560 164)">
    <line x1="70" y1="70" x2="190" y2="54" stroke="#6b7a90" stroke-width="5"/>
    <line x1="190" y1="54" x2="285" y2="110" stroke="#6b7a90" stroke-width="5"/>
    <line x1="70" y1="70" x2="126" y2="180" stroke="#6b7a90" stroke-width="5"/>
    <line x1="126" y1="180" x2="285" y2="110" stroke="#6b7a90" stroke-width="5"/>
    <line x1="190" y1="54" x2="126" y2="180" stroke="#3b82f6" stroke-width="7"/>
    <line x1="126" y1="180" x2="235" y2="232" stroke="#10b981" stroke-width="7"/>
    <circle cx="70" cy="70" r="25" fill="#ffffff" stroke="#1f6feb" stroke-width="5"/>
    <circle cx="190" cy="54" r="25" fill="#ffffff" stroke="#1f6feb" stroke-width="5"/>
    <circle cx="285" cy="110" r="25" fill="#ffffff" stroke="#1f6feb" stroke-width="5"/>
    <circle cx="126" cy="180" r="25" fill="#ffffff" stroke="#1f6feb" stroke-width="5"/>
    <circle cx="235" cy="232" r="25" fill="#ffffff" stroke="#10b981" stroke-width="5"/>
    <text x="55" y="76" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">A</text>
    <text x="184" y="60" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">B</text>
    <text x="280" y="116" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">C</text>
    <text x="120" y="186" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">D</text>
    <text x="229" y="238" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">E</text>
    <rect x="18" y="292" width="320" height="66" rx="10" fill="#edf7f3" stroke="#b7ded1"/>
    <text x="38" y="320" fill="#1b2430" font-family="Arial, sans-serif" font-size="16" font-weight="700">Scoring pipeline</text>
    <text x="38" y="346" fill="#4b5b70" font-family="Arial, sans-serif" font-size="14">CSV edges -> graph -> constraints -> ranking</text>
  </g>
</svg>
