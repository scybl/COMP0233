<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TubePlanner proposal ranking showcase</title>
  <desc id="desc">A README preview showing the cached UCL Tube Planning snapshot, proposal rankings, and reproducible CLI output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.48" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="56" y="50" width="1088" height="575" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="56" y="50" width="1088" height="122" rx="28" fill="#111827"/>
  <rect x="56" y="136" width="1088" height="36" fill="#111827"/>
  <text x="96" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">TubePlanner</text>
  <text x="96" y="141" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="18">Public-transport extension ranking with cost constraints and max-flow scoring</text>
  <rect x="884" y="82" width="212" height="44" rx="22" fill="#14b8a6"/>
  <text x="920" y="110" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Local Snapshot Demo</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <text x="122" y="250" fill="#64748b" font-size="15">UCL snapshot</text>
    <text x="122" y="287" fill="#0f172a" font-size="34" font-weight="700">446 / 535</text>
    <text x="122" y="313" fill="#475569" font-size="14">stations / links</text>

    <rect x="350" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#dcfce7"/>
    <text x="376" y="250" fill="#64748b" font-size="15">Best proposal</text>
    <text x="376" y="287" fill="#047857" font-size="29" font-weight="700">223.32</text>
    <text x="376" y="313" fill="#475569" font-size="14">thameslink</text>

    <rect x="604" y="210" width="226" height="116" rx="18" fill="#ffffff" stroke="#fef3c7"/>
    <text x="630" y="250" fill="#64748b" font-size="15">Cost date</text>
    <text x="630" y="287" fill="#92400e" font-size="30" font-weight="700">2026</text>
    <text x="630" y="313" fill="#475569" font-size="14">July 1 snapshot run</text>

    <rect x="858" y="210" width="238" height="116" rx="18" fill="#ffffff" stroke="#fce7f3"/>
    <text x="884" y="250" fill="#64748b" font-size="15">Outputs</text>
    <text x="884" y="287" fill="#831843" font-size="28" font-weight="700">CSV / JSON</text>
    <text x="884" y="313" fill="#475569" font-size="14">ranked proposal records</text>
  </g>

  <g transform="translate(96 382)">
    <rect width="436" height="178" rx="20" fill="#0b1220"/>
    <circle cx="30" cy="30" r="7" fill="#fb7185"/>
    <circle cx="54" cy="30" r="7" fill="#fbbf24"/>
    <circle cx="78" cy="30" r="7" fill="#34d399"/>
    <text x="30" y="72" fill="#93c5fd" font-family="Menlo, Consolas, monospace" font-size="15">Rank  Proposal             Score</text>
    <text x="30" y="106" fill="#ffffff" font-family="Menlo, Consolas, monospace" font-size="15">1     thameslink        223.32</text>
    <text x="30" y="138" fill="#e2e8f0" font-family="Menlo, Consolas, monospace" font-size="15">2     weaving_cross     198.75</text>
    <text x="30" y="168" fill="#a7f3d0" font-family="Menlo, Consolas, monospace" font-size="14">bash scripts/run_ucl_snapshot.sh</text>
  </g>

  <g transform="translate(594 368)">
    <rect width="500" height="204" rx="22" fill="#ffffff" stroke="#dbeafe"/>
    <text x="30" y="48" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">Scoring Flow</text>
    <line x1="30" y1="72" x2="470" y2="72" stroke="#e2e8f0"/>
    <circle cx="80" cy="130" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <circle cx="205" cy="130" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <circle cx="330" cy="130" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <circle cx="438" cy="130" r="34" fill="#fce7f3" stroke="#db2777" stroke-width="4"/>
    <path d="M114 130 H171" stroke="#64748b" stroke-width="4"/>
    <path d="M239 130 H296" stroke="#64748b" stroke-width="4"/>
    <path d="M364 130 H404" stroke="#64748b" stroke-width="4"/>
    <text x="56" y="136" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="13" font-weight="700">CSV</text>
    <text x="183" y="136" fill="#166534" font-family="Arial, sans-serif" font-size="13" font-weight="700">Graph</text>
    <text x="306" y="136" fill="#92400e" font-family="Arial, sans-serif" font-size="13" font-weight="700">Flow</text>
    <text x="415" y="136" fill="#9d174d" font-family="Arial, sans-serif" font-size="13" font-weight="700">Rank</text>
    <text x="30" y="184" fill="#64748b" font-family="Arial, sans-serif" font-size="14">CSV edges -> adjacency matrix -> Edmonds-Karp -> deterministic ranking</text>
  </g>
</svg>
